# Per-experiment configuration: one YAML per phone-video clip.
# Values marked TUNE are set from scripts/replay_libero.py diagnostics
# (printed by v2d_to_libero.extract --summary).

# --- inputs -----------------------------------------------------------------
v2d_result_dir: data/outputs/clip01/result_slam_gravity_aligned
mano_model_dir: ~/Downloads/mano_v1_2/models  # MANO_RIGHT.pkl / MANO_LEFT.pkl
hand: right                                   # left | right
video_fps: 30                                 # actual FPS of the video passed to V2D
output_dir: data/demos

# --- scale anchoring ---------------------------------------------------------
scale:
  method: fixed                 # V2D world-unit to metre scale, calibrate from scene
  fixed_scale: 1.0
  # grasp_aperture is experimental: MANO hand scale may differ from world scale.
  # method: grasp_aperture
  # known_object_width_m: 0.080
  # hold_frame_range: [120, 160]

# The tracked object at the start of the clip is mapped to this LIBERO object.
# If the name differs in your installed LIBERO, replay prints available names.
object:
  libero_name: akita_black_bowl_1
  # sim_position: [x, y, z]    # explicit override if body name is unavailable

# --- V2D world → Libero world -------------------------------------------------
# After GeoCalib alignment the V2D world is z-up, x=right, y=camera-forward.
# Origin is computed from the tracked video's object and the LIBERO object.
# Tune yaw and the wrist-to-tool offset against an overlay/rejected rollout.
workspace:
  origin: [0.0, 0.0, 0.0]
  yaw_deg: 0.0
  axis_signs: [1.0, 1.0, 1.0]   # product must be +1 to preserve rotations

# --- wrist → tool offset -------------------------------------------------------
# TUNE: align rendered gripper to the wrist overlay in the V2D aligned render.
eef:
  rotation_offset_deg: [0.0, 0.0, 0.0]
  position_offset: [0.0, 0.0, 0.0]   # metres, wrist frame (post-scale)

# --- gripper ------------------------------------------------------------------
gripper:
  aperture_open_m: auto          # auto = p95 of valid aperture
  aperture_closed_m: auto        # auto = p20 of valid aperture
  hysteresis: 0.0

# --- Libero environment --------------------------------------------------------
libero:
  suite: libero_spatial          # libero_spatial | libero_10 | libero_90 | ...
  task: pick_up_the_black_bowl_from_table_center_and_place_it_on_the_plate
  # bddl_file_path: /path/to/task.bddl   # set to override suite+task lookup
  camera: agentview
  camera_size: 256
  control_freq: 20
  seed: 0
  gripper_convention: neg1_open  # VERIFY with scripts/check_conventions.py

# --- replay controller ----------------------------------------------------------
replay:
  pos_gain: 1.0                  # TUNE: >1 faster pursuit, <1 smoother
  rot_gain: 1.0
  pos_clip: 0.05                 # controller target correction in metres
  rot_clip: 0.3                  # controller target correction in radians
  osc_translation_output_m: 0.05 # verify in installed robosuite OSC config
  osc_rotation_output_rad: 0.5   # verify in installed robosuite OSC config
