<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
  <title id="title">Phone video to LIBERO replay pipeline</title>
  <desc id="desc">The applicant's bowl video supplies either measured image waypoints or a reconstructed V2D object track. Both guide the transport phase in LIBERO, while an official demonstration supplies the grasp. The five-run evaluations end at first physics success; a separate replay continues through release. A full-hand retargeting attempt failed.</desc>
  <rect width="1200" height="290" rx="22" fill="#101820"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#f4f7f8">
    <text x="32" y="39" font-size="22" font-weight="700">From one phone video to two tested transports</text>
    <text x="33" y="64" font-size="14" fill="#b7c7cd">The official LIBERO demonstration supplies the grasp in both variants.</text>
    <rect x="32" y="92" width="201" height="118" rx="14" fill="#263940" stroke="#73909a"/>
    <text x="52" y="124" font-size="18" font-weight="700">Recorded video</text>
    <text x="52" y="150" font-size="14" fill="#d1dee2">Bowl → plate</text>
    <text x="52" y="174" font-size="14" fill="#d1dee2">24.3 s · 10 fps V2D input</text>
    <path d="M234 151h57" stroke="#d1dee2" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="292" y="87" width="255" height="57" rx="12" fill="#214e5a" stroke="#50c7da"/>
    <text x="308" y="112" font-size="16" font-weight="700">2D bowl waypoints</text>
    <text x="308" y="131" font-size="13" fill="#cde8ed">13 inspected points</text>
    <rect x="292" y="156" width="255" height="57" rx="12" fill="#393051" stroke="#b798ed"/>
    <text x="308" y="181" font-size="16" font-weight="700">V2D 3D object track</text>
    <text x="308" y="200" font-size="13" fill="#e1d8f7">Reconstructed bowl motion</text>
    <path d="M548 115h59 M548 184h59" stroke="#d1dee2" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="608" y="92" width="244" height="118" rx="14" fill="#344237" stroke="#8fc393"/>
    <text x="628" y="123" font-size="18" font-weight="700">LIBERO transport</text>
    <text x="628" y="149" font-size="14" fill="#dce9dc">OSC robot commands</text>
    <text x="628" y="173" font-size="14" fill="#dce9dc">Stop at physics success</text>
    <path d="M853 151h56" stroke="#d1dee2" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="910" y="92" width="255" height="118" rx="14" fill="#214d37" stroke="#77d196"/>
    <text x="930" y="125" font-size="19" font-weight="700">5/5 each</text>
    <text x="930" y="151" font-size="14" fill="#d6eee0">Same five initial states</text>
    <text x="930" y="176" font-size="14" fill="#d6eee0">Replay episodes exported</text>
    <text x="33" y="251" font-size="14" fill="#f5c6bd">Separate test: V2D hand → robot wrist replay: 0/1. No policy training or generalization result.</text>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#d1dee2"/></marker></defs>
</svg>
